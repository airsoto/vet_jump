workflows:
  vet-jump-ios:
    name: Vet JUMP iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Vet JUMP
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.airsoto.vetjump
      vars:
        XCODE_PROJECT: VetJUMP.xcodeproj
        XCODE_SCHEME: Vet JUMP
    scripts:
      - name: Apply App Store signing profile
        script: xcode-project use-profiles
      - name: Configure bundle identifier and build number
        script: |
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build signed IPA
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
      - /tmp/xcodebuild_logs/*.log
